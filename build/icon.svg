<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a35"/>
      <stop offset="1" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc0ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <clipPath id="front"><rect x="404" y="364" width="400" height="460" rx="44"/></clipPath>
  </defs>
  <!-- macOS-style squircle body with standard padding -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- the live page -->
  <rect x="220" y="200" width="400" height="460" rx="44" fill="#eef1f6"/>
  <rect x="220" y="200" width="400" height="78" rx="44" fill="#d9dee8"/>
  <rect x="220" y="240" width="400" height="38" fill="#d9dee8"/>
  <circle cx="270" cy="239" r="12" fill="#ff6b5f"/>
  <circle cx="308" cy="239" r="12" fill="#ffc23d"/>
  <circle cx="346" cy="239" r="12" fill="#35c759"/>
  <rect x="260" y="320" width="220" height="28" rx="14" fill="#b9c1cf"/>
  <rect x="260" y="372" width="300" height="20" rx="10" fill="#cfd5df"/>
  <rect x="260" y="410" width="260" height="20" rx="10" fill="#cfd5df"/>

  <!-- the design, ghosted on top -->
  <rect x="404" y="364" width="400" height="460" rx="44" fill="url(#ghost)" fill-opacity=".55"/>
  <!-- overlap: where the layers meet -->
  <g clip-path="url(#front)">
    <rect x="220" y="200" width="400" height="460" rx="44" fill="#ffffff" fill-opacity=".55"/>
  </g>
  <rect x="404" y="364" width="400" height="460" rx="44" fill="none" stroke="#bcd3ff" stroke-width="14" stroke-dasharray="34 22"/>
</svg>
